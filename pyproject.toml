[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "china-garden"
version = "0.1.0"
description = "Inbound AI call agent for China Garden (family restaurant): FAQ + takeout orders with mandatory read-back"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/china_garden"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
