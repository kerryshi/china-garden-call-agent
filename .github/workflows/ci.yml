name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the default GITHUB_TOKEN is read-only unless a job opts up.
permissions:
  contents: read

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # No `claude` CLI, API key, or TTS model on the runner: the suite runs on the
      # deterministic rule backend and fakes the CLI process, which is what CI proves.
      - run: pip install -e ".[dev,web]"
      - run: ruff check .
      - run: pytest -q
